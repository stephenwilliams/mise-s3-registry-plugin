[env]
MISE_USE_VERSIONS_HOST = "0"
HK_MISE = "1"

[hooks]
postinstall = "hk install --mise"

[tools]
actionlint = "latest"
hk = "2.10"
lua = "5.1"
lua-language-server = "latest"
pkl = "latest"
python = "3"
shellcheck = "latest"
stylua = "latest"

[tasks.format]
description = "Format Lua scripts"
run = "stylua metadata.lua hooks/ lib/ test/"

[tasks.lint]
description = "Lint Lua scripts and GitHub Actions using hk"
run = "hk check"

[tasks.lint-fix]
description = "Fix linting issues"
run = "hk fix"

[tasks.test-unit]
description = "Unit-test lib/ on Lua 5.1, the version mise embeds"
run = "lua test/unit/s3reg_test.lua"

[tasks.test-smoke]
description = "Real mise install of a fake tool from a local fake s3reg, in an isolated mise home"
run = "python test/smoke/smoke.py"

[tasks.ci]
description = "Run all CI checks"
depends = ["lint", "test-unit", "test"]
