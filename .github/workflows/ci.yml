name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - run: mise run ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # End-to-end round-trip against a real s3reg serve + MinIO. Linux only:
  # GitHub's macOS runners have no Docker daemon.
  e2e:
    runs-on: ubuntu-latest
    env:
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out s3-registry (the server the plugin talks to)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stephenwilliams/s3-registry
          path: s3-registry
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Build s3reg
        run: mise run build
        working-directory: s3-registry
      - name: Run E2E
        run: mise run test-e2e
        env:
          S3REG_E2E: "1"
          S3REG_BIN: ${{ github.workspace }}/s3-registry/bin/s3reg
